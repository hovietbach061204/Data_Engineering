stages:
  - sync
  - lint
  - validate
  - security

# === Ensure branch is up-to-date with master ===
check_master_sync:
  image: alpine:latest
  stage: sync
  script:
    - apk add --no-cache git
    - git fetch origin master
    - echo "Checking if branch $CI_COMMIT_REF_NAME is up-to-date with master..."
    # Fail if there are commits in master not in this branch
    - |
      if [ "$(git rev-list HEAD..origin/master --count)" -ne 0 ]; then
        echo "Your branch is behind master. Please pull/rebase from master before pushing."
        exit 1
      else
        echo "Branch is up-to-date with master."
      fi
  rules:
    - if: '$CI_COMMIT_BRANCH =~ /^(master|main|production\/.*)$/'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "push" || $CI_PIPELINE_SOURCE == "merge_request_event"'
      when: on_success

lint_code:
  image: python:3.11
  stage: lint
  script:
    - pip install flake8
    - flake8 .

commit_message_lint:
  image: alpine:latest
  stage: validate
  script:
    - |
      apk add --no-cache git grep
      MSG="$(git log -1 --pretty=%B)"
      echo "Last commit message: $MSG"
      echo "$MSG" | head -n1 | grep -Eq '^(build|chore|ci|docs|feat|fix|perf|refactor|revert|style|test)(\([a-z0-9._-]+\))?(!)?:\s.{10,}$'
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" || $CI_PIPELINE_SOURCE == "merge_request_event"'

branch_name_lint:
  image: alpine:latest
  stage: validate
  script:
    - |
      echo "Branch: $CI_COMMIT_REF_NAME"
      echo "$CI_COMMIT_REF_NAME" | grep -Eq '^(feature|fix|hotfix|chore|refactor|docs|test|perf|build|ci|release)/[0-9]{1,6}-[a-z0-9._-]+$'
  rules:
    - if: '$CI_COMMIT_BRANCH =~ /^(master|main|production\/.*)$/'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "push" || $CI_PIPELINE_SOURCE == "merge_request_event"'
      when: on_success

# Include GitLab Secret Detection template
include:
  - template: Security/Secret-Detection.gitlab-ci.yml

# Override its default stage ("test") to match your pipeline
secret_detection:
  stage: security